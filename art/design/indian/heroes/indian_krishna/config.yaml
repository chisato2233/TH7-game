# Hero Configuration
# 英雄配置

heroId: indian_krishna              # 全局唯一ID，建议带阵营前缀
displayName: Krishna                # 显示名称
description: The Dark One, wielder of the Sudarshana Chakra and divine charioteer.
faction: Indian                     # [枚举] 对应 faction.yaml
class: Mage                         # [枚举] 高法力/知识 (Spell Power/Knowledge)

# 视觉资源 (本文件夹内)
portrait: portrait_2048x2048.png         # 头像
worldSprite: worldsprite_1024x1024.png  # 世界Sprite

# 基础属性 (参考：神话人物属性可以略高)
attack: 2
defense: 3
spellPower: 6                       # 突出高法术强度
knowledge: 5                        # 突出高智慧

# 初始军队 (强引用)
startingArmy:
  - unit: "@UnitConfig_indian_war_elephant"  # 之前定义的战象
    count: 1
#  - unit: "@UnitConfig_neutral_peasant"      # 或者是印度阵营的基础兵种(如 Gopis/Cowherds)
#    count: 20